[package]
name = "xschem-viewer"
version = "0.1.0"
edition = "2021"
description = "Native Rust renderer for Xschem schematics (.sch/.sym)"
license = "Apache-2.0"
authors = [
    "euler <carlos.cuevaleon@gmail.com>",
    "Adriel2503 <Adriel2503@users.noreply.github.com>",
]

[lib]
name = "xschem_viewer"
path = "src/lib.rs"

[[bin]]
name = "xschem-viewer"
path = "src/main.rs"

[dependencies]
# Parser
pest = "2.7"
pest_derive = "2.7"

# Serialización (semantic types)
serde = { version = "1.0", features = ["derive"] }

# Home directory detection (for xschemrc lookup)
dirs = "6.0"

# Error handling
thiserror = "2.0"

# Integración opcional con viewer-core (ecosistema Riku).
# Cuando la feature está activa, xschem-viewer expone un `XschemBackend`
# que implementa el trait `viewer_core::ViewerBackend` y conversiones
# entre sus tipos internos y los neutros. Sin la feature, el crate sigue
# siendo autocontenido y no arrastra dependencias async.
# Path relativo asumiendo que xschem-viewer-rust vive como submodule en
# riku_chip/external/. Para uso standalone con esta feature activa, se
# requiere tener `viewer-core` accesible dos niveles arriba (típicamente
# clonando riku_chip y usando este crate como submodule de ese workspace).
viewer-core = { path = "../../viewer-core", optional = true }
async-trait = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[features]
default = []
viewer-core-compat = ["dep:viewer-core", "dep:async-trait", "dep:tokio"]

[dev-dependencies]
