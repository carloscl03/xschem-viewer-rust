[package]
name = "xschem-viewer"
version = "0.1.0"
edition = "2021"
description = "Native Rust renderer for Xschem schematics (.sch/.sym)"
license = "Apache-2.0"
authors = [
    "euler <carlos.cuevaleon@gmail.com>",
    "Adriel2503 <Adriel2503@users.noreply.github.com>",
]

[lib]
name = "xschem_viewer"
path = "src/lib.rs"

[[bin]]
name = "xschem-viewer"
path = "src/main.rs"

[dependencies]
# Parser
pest = "2.7"
pest_derive = "2.7"

# Serialización
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SVG generation
svg = "0.17"

[dev-dependencies]
